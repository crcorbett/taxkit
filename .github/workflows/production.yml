name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One Production apply at a time; a queued run waits rather than cancelling the
# apply in progress.
concurrency:
  group: taxkit-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://taxkit.dev
    steps:
      # A missing environment secret would otherwise fail only at the first
      # native command, after verification. Only this boolean reaches the shell.
      - name: Check the production Doppler token is set
        env:
          DOPPLER_TOKEN_SET: ${{ secrets.DOPPLER_TOKEN != '' }}
        run: test "$DOPPLER_TOKEN_SET" = true || { echo "::error::The production environment has no DOPPLER_TOKEN secret"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch --track main origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - id: playwright-identity
        run: echo "version=$(apps/web/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}
      - run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}
      # Verification ends with the required credential-free native pair suite,
      # after source-rewriting tests and builds finish. A failure blocks plan/apply.
      # Same checks as the Checks workflow, before any credential is used. The
      # Turbo remote cache needs Checks' separate DOPPLER_CI_TOKEN, so deploys
      # use the local cache only.
      - name: Run verification and required native suite
        env:
          TURBO_CACHE: local:rw
        run: bun run verification
      # Deploy's --yes also lets native Alchemy set up or upgrade the shared
      # state store. This plan has no --yes, so it fails closed when the store
      # is missing or on another version, and deploy runs only after it passes.
      - name: Plan production with native Alchemy
        run: bun run production:plan --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy production with native Alchemy
        run: bun run production:deploy --yes --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Check Website, www redirect and public API
        shell: bash
        run: |
          probe() {
            curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --output /dev/null --write-out "$2" "$1"
          }
          website="$(probe https://taxkit.dev/ '%{http_code}')"
          echo "https://taxkit.dev/ -> $website"
          test "$website" = 200
          redirect="$(probe 'https://www.taxkit.dev/docs?from=actions' '%{http_code} %{redirect_url}')"
          echo "https://www.taxkit.dev/docs?from=actions -> $redirect"
          test "$redirect" = "301 https://taxkit.dev/docs?from=actions"
          api="$(probe https://api.taxkit.dev/api/health '%{http_code}')"
          echo "https://api.taxkit.dev/api/health -> $api"
          test "$api" = 200
      # Information only: re-reads every deployed resource against the state the
      # deploy just wrote and reports drift without repairing it. Beta.81 can
      # report Workers with custom domains as changed after a clean deploy.
      - name: Read back provider drift with native Alchemy
        continue-on-error: true
        run: bun run production:drift --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
