name: Docs Preview Teardown

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed same-repository pull-request number
        required: true
        type: string
      reviewed_workflow_sha:
        description: Reviewed default-branch implementation SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: taxkit-docs-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Teardown exact Preview stage
    if: github.repository == 'crcorbett/taxkit' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: taxkit-docs-preview
    env:
      ALCHEMY_PROFILE: default
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha || github.sha }}
      TURBO_CACHE: local:rw
    steps:
      - name: Check exact closed PR and reviewed default-branch source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$pr_json")" = "closed"
          test "$(jq -r .base.ref <<<"$pr_json")" = "main"
          test "$(jq -r .head.repo.full_name <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(jq -r .pull_request.base.ref "$GITHUB_EVENT_PATH")" = "main"
            test "$(jq -r .pull_request.state "$GITHUB_EVENT_PATH")" = "closed"
            test "$(jq -r .pull_request.head.repo.full_name "$GITHUB_EVENT_PATH")" = "$GITHUB_REPOSITORY"
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          test "$REVIEWED_WORKFLOW_SHA" = "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          jq -nS \
            --arg candidate "$REVIEWED_WORKFLOW_SHA" \
            --arg pr "$PR_NUMBER" \
            --arg workflow "$REVIEWED_WORKFLOW_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            '{candidateCommit:$candidate,operation:"destroy",prNumber:($pr|tonumber),sourceRef:"refs/heads/main",workflowCommit:$workflow,workflowName:"Docs Preview Teardown",workflowPath:".github/workflows/docs-preview-teardown.yml",workflowRunId:$run}' \
            > "$RUNNER_TEMP/docs-deployment/workflow-input.json"

      - name: Check out reviewed default-branch implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.REVIEWED_WORKFLOW_SHA }}

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_WORKFLOW_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Resolve Bun package cache path
        id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun package cache
        id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}

      - name: Schema-check teardown workflow input
        env:
          TAXKIT_WORKFLOW_INPUT_RECEIPT: ${{ runner.temp }}/docs-deployment/workflow-input.json
          TAXKIT_WORKFLOW_INPUT_CANDIDATE_COMMIT: ${{ env.REVIEWED_WORKFLOW_SHA }}
          TAXKIT_WORKFLOW_INPUT_WORKFLOW_COMMIT: ${{ env.REVIEWED_WORKFLOW_SHA }}
          TAXKIT_WORKFLOW_INPUT_RUN_ID: ${{ github.run_id }}
          TAXKIT_WORKFLOW_INPUT_WORKFLOW_PATH: .github/workflows/docs-preview-teardown.yml
          TAXKIT_WORKFLOW_INPUT_OPERATION: destroy
          TAXKIT_WORKFLOW_INPUT_PR_NUMBER: ${{ env.PR_NUMBER }}
        run: bun run check:docs-deployment-workflow-input

      - name: Resolve Playwright cache identity
        id: playwright-identity
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(apps/docs/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium cache
        id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}

      - name: Install pinned Playwright browser
        run: apps/docs/node_modules/.bin/playwright install chromium

      - name: Save Playwright Chromium cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}

      - name: Fetch Preview provider configuration
        id: doppler-provider
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_PROVIDER_TOKEN }}

      - name: Check Preview provider configuration identity
        env:
          DOPPLER_CONFIG: ${{ steps.doppler-provider.outputs.DOPPLER_CONFIG }}
          DOPPLER_PROJECT: ${{ steps.doppler-provider.outputs.DOPPLER_PROJECT }}
        run: test "$DOPPLER_PROJECT" = "taxkit" && test "$DOPPLER_CONFIG" = "stg_preview"

      - name: Validate deployment owners
        run: bun run check:docs-deployment

      - name: Build provider-free docs proof
        run: bun run docs:build

      - name: Run mutation-capable Alchemy state-store bootstrap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler-provider.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler-provider.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          ALCHEMY_PLAIN=1 CI=1 bunx alchemy provider cloudflare bootstrap --profile "$ALCHEMY_PROFILE" --worker-name alchemy-state-store
          TAXKIT_WORKFLOW_EVIDENCE_BOOTSTRAP_PATH="$RUNNER_TEMP/docs-deployment/bootstrap.json" \
          TAXKIT_WORKFLOW_EVIDENCE_CANDIDATE_COMMIT="$REVIEWED_WORKFLOW_SHA" \
          TAXKIT_WORKFLOW_EVIDENCE_MODE=bootstrap \
          TAXKIT_WORKFLOW_EVIDENCE_RUN_ID="$GITHUB_RUN_ID" \
          TAXKIT_WORKFLOW_EVIDENCE_STAGE="pr-$PR_NUMBER" \
            bun --conditions=source run tools/docs-deployment/workflow-evidence.runtime.ts

      - name: Equal dry-run and destroy exact Preview stage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler-provider.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler-provider.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-deployment"
          stage="pr-${PR_NUMBER}"
          read_inventory() {
            local output_path="$1"
            local stderr_path="$2"
            local attempts_path="$3"
            local inventory_status=1
            local stderr_bytes=0
            : > "$attempts_path"
            for retry in 1 2 3; do
              TAXKIT_DOCS_DEPLOYMENT_INVENTORY_REPORT="$output_path" \
              ALCHEMY_PROFILE="$ALCHEMY_PROFILE" CI=1 bun run check:docs-deployment-inventory 2> "$stderr_path" && inventory_status=0 || inventory_status=$?
              stderr_bytes="$(wc -c < "$stderr_path" | tr -d ' ')"
              sed -E 's/(Bearer[[:space:]]+|token[=:])[A-Za-z0-9._-]+/\1[REDACTED]/g' "$stderr_path" > "${stderr_path}.redacted"
              mv "${stderr_path}.redacted" "$stderr_path"
              printf 'attempt=%s exit=%s stderrBytes=%s\n' "$retry" "$inventory_status" "$stderr_bytes" >> "$attempts_path"
              if [ "$inventory_status" -eq 0 ]; then
                return 0
              fi
              if [ "$stderr_bytes" -ne 0 ]; then
                break
              fi
              if [ "$retry" -lt 3 ]; then
                sleep 5
              fi
            done
            cat "$stderr_path" >&2 || true
            printf 'inventory read exit=%s path=%s\n' "$inventory_status" "$output_path" >&2
            return "$inventory_status"
          }
          read_inventory "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" "$RUNNER_TEMP/docs-deployment/provider-inventory-before.stderr.txt" "$RUNNER_TEMP/docs-deployment/provider-inventory-before.attempts.txt"
          stage_count_before="$(jq --arg stage "$stage" '[.stages[] | select(.stage == $stage)] | length' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
          test "$stage_count_before" -eq 0 || test "$stage_count_before" -eq 1
          previous_worker_name=""
          previous_worker_url=""
          if [ "$stage_count_before" -eq 1 ]; then
            jq -e --arg stage "$stage" '([.stages[] | select(.stage == $stage) | .resources | map(.logicalId) | sort] | . == [["DocsWebsite"]]) and ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 1)' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json" > /dev/null
            previous_worker_name="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerName' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
            previous_worker_url="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerUrl' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
          fi
          for attempt in one two; do
            dry_run_status=1
            for retry in 1 2 3; do
              ALCHEMY_TELEMETRY_DISABLED=1 ALCHEMY_PLAIN=1 CI=1 bun node_modules/alchemy/bin/alchemy.ts destroy --dry-run --stage "$stage" --profile "$ALCHEMY_PROFILE" --yes > "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.txt" 2> "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.stderr.txt" && dry_run_status=0 || dry_run_status=$?
              sed -E 's/(Bearer[[:space:]]+|token[=:])[A-Za-z0-9._-]+/\1[REDACTED]/g' "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.stderr.txt" > "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.stderr.redacted.txt"
              mv "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.stderr.redacted.txt" "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.stderr.txt"
              if [ "$dry_run_status" -eq 0 ]; then
                break
              fi
              if [ "$retry" -lt 3 ]; then
                sleep 5
              fi
            done
            if [ "$dry_run_status" -ne 0 ]; then
              sed -E 's/(Bearer[[:space:]]+|token[=:])[A-Za-z0-9._-]+/\1[REDACTED]/g' "$RUNNER_TEMP/docs-deployment/destroy-${attempt}.stderr.txt" >&2 || true
              printf 'alchemy destroy --dry-run exit=%s attempt=%s\n' "$dry_run_status" "$attempt" >&2
              exit "$dry_run_status"
            fi
          done
          lockfile_sha256="$(shasum -a 256 bun.lock | cut -d ' ' -f1)"
          config_sha256="$(for file in alchemy.run.ts apps/docs/package.json apps/docs/vite.config.ts packages/infrastructure/src/cloudflare/website.ts packages/infrastructure/src/stage.ts packages/infrastructure/src/stack.ts apps/docs/public/_headers; do shasum -a 256 "$file"; done | shasum -a 256 | cut -d ' ' -f1)"
          deployment_input_sha256="$(git ls-files -z -- alchemy.run.ts apps/docs packages/infrastructure packages/docs-content packages/docs-fumadocs | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d ' ' -f1)"
          destroy_sha256="$(
            TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$REVIEWED_WORKFLOW_SHA" \
            TAXKIT_WORKFLOW_PLAN_CONFIG_SHA256="$config_sha256" \
            TAXKIT_WORKFLOW_PLAN_DEPLOYMENT_INPUT_SHA256="$deployment_input_sha256" \
            TAXKIT_WORKFLOW_PLAN_KIND=destroy \
            TAXKIT_WORKFLOW_PLAN_LOCKFILE_SHA256="$lockfile_sha256" \
            TAXKIT_WORKFLOW_PLAN_PROJECTION_PATH="$RUNNER_TEMP/docs-deployment/projection.json" \
            TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
            TAXKIT_WORKFLOW_PLAN_TEXT_PATH="$RUNNER_TEMP/docs-deployment/destroy-one.txt" \
            bun --conditions=source run tools/docs-deployment/workflow-plan-projection.runtime.ts
          )"
          destroy_replan_sha256="$(
            TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$REVIEWED_WORKFLOW_SHA" \
            TAXKIT_WORKFLOW_PLAN_CONFIG_SHA256="$config_sha256" \
            TAXKIT_WORKFLOW_PLAN_DEPLOYMENT_INPUT_SHA256="$deployment_input_sha256" \
            TAXKIT_WORKFLOW_PLAN_KIND=destroy \
            TAXKIT_WORKFLOW_PLAN_LOCKFILE_SHA256="$lockfile_sha256" \
            TAXKIT_WORKFLOW_PLAN_PROJECTION_PATH="$RUNNER_TEMP/docs-deployment/destroy-two-projection.json" \
            TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
            TAXKIT_WORKFLOW_PLAN_TEXT_PATH="$RUNNER_TEMP/docs-deployment/destroy-two.txt" \
            bun --conditions=source run tools/docs-deployment/workflow-plan-projection.runtime.ts
          )"
          test "$destroy_sha256" = "$destroy_replan_sha256"
          jq -nS \
            --arg acceptedBy "$GITHUB_ACTOR" \
            --arg acceptedPlanSha256 "$destroy_sha256" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile projection "$RUNNER_TEMP/docs-deployment/projection.json" \
            '{acceptedBy:$acceptedBy,acceptedPlanSha256:$acceptedPlanSha256,observedAt:$observedAt,operation:"preview-destroy",projection:$projection[0],receiptPath:("docs/evidence/deployments/workflow-" + env.GITHUB_RUN_ID + "/destroy-plan.json"),replanSha256:$acceptedPlanSha256,schemaVersion:2}' \
            > "$RUNNER_TEMP/docs-deployment/destroy-plan.json"
          TAXKIT_WORKFLOW_PLAN_RECEIPT="$RUNNER_TEMP/docs-deployment/destroy-plan.json" \
          TAXKIT_WORKFLOW_PLAN_CANDIDATE_COMMIT="$REVIEWED_WORKFLOW_SHA" \
          TAXKIT_WORKFLOW_PLAN_OPERATION=preview-destroy \
          TAXKIT_WORKFLOW_PLAN_STAGE="$stage" \
          TAXKIT_WORKFLOW_PLAN_SHA256="$destroy_sha256" \
          TAXKIT_WORKFLOW_PLAN_REQUIRE_REPLAN=1 \
            bun run check:docs-deployment-workflow-plan
          read_inventory "$RUNNER_TEMP/docs-deployment/provider-inventory-pre-destroy.json" "$RUNNER_TEMP/docs-deployment/provider-inventory-pre-destroy.stderr.txt" "$RUNNER_TEMP/docs-deployment/provider-inventory-pre-destroy.attempts.txt"
          jq -e --arg stage "$stage" --argjson expected "$stage_count_before" --arg worker "$previous_worker_name" --arg url "$previous_worker_url" '
            ([.stages[] | select(.stage == $stage)] | length == $expected) and
            (if $expected == 0 then true else
              ([.stages[] | select(.stage == $stage) | .resources | map(.logicalId) | sort] | . == [["DocsWebsite"]]) and
              ([.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite" and .workerUrl == $url)] | length == 1) and
              ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite" and .workerName == $worker)] | length == 1)
            end)
          ' "$RUNNER_TEMP/docs-deployment/provider-inventory-pre-destroy.json" > /dev/null
          if [ "$stage_count_before" -eq 1 ]; then
            ALCHEMY_TELEMETRY_DISABLED=1 ALCHEMY_PLAIN=1 CI=1 bun node_modules/alchemy/bin/alchemy.ts destroy --stage "$stage" --profile "$ALCHEMY_PROFILE" --yes
          fi
          read_inventory "$RUNNER_TEMP/docs-deployment/provider-inventory.json" "$RUNNER_TEMP/docs-deployment/provider-inventory.stderr.txt" "$RUNNER_TEMP/docs-deployment/provider-inventory.attempts.txt"
          jq -e --arg stage "$stage" '(.agreement == "state-provider-agree") and ([.stages[] | select(.stage == $stage)] | length == 0) and ([.providerWorkers[] | select(.stage == $stage and .logicalId == "DocsWebsite")] | length == 0)' "$RUNNER_TEMP/docs-deployment/provider-inventory.json" > /dev/null
          if [ "$stage_count_before" -eq 1 ]; then
            worker_url_before="$(jq -er --arg stage "$stage" '.stages[] | select(.stage == $stage) | .resources[] | select(.logicalId == "DocsWebsite") | .workerUrl' "$RUNNER_TEMP/docs-deployment/provider-inventory-before.json")"
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$worker_url_before")" = "404"
          fi
          state_store_id="$(jq -er '.stateStore.id' "$RUNNER_TEMP/docs-deployment/provider-inventory.json")"
          jq -nS \
            --arg account "$CLOUDFLARE_ACCOUNT_ID" \
            --arg candidate "$REVIEWED_WORKFLOW_SHA" \
            --arg config "$config_sha256" \
            --arg deployment "$deployment_input_sha256" \
            --arg lockfile "$lockfile_sha256" \
            --arg formerWorkerName "$previous_worker_name" \
            --arg formerWorkerUrl "$previous_worker_url" \
            --arg stage "$stage" \
            --arg stateStoreId "$state_store_id" \
            --argjson preexistingStage "$stage_count_before" \
            '{accountId:$account,candidateCommit:$candidate,configSha256:$config,deploymentInputSha256:$deployment,formerWorkerName:(if $formerWorkerName == "" then null else $formerWorkerName end),formerWorkerUrl:(if $formerWorkerUrl == "" then null else $formerWorkerUrl end),lockfileSha256:$lockfile,preexistingStage:($preexistingStage == 1),providerWorkerAbsent:true,schemaVersion:1,stage:$stage,stateStoreId:$stateStoreId,stateStageAbsent:true}' \
            > "$RUNNER_TEMP/docs-deployment/provider-readback.json"
          TAXKIT_WORKFLOW_TEARDOWN_READBACK="$RUNNER_TEMP/docs-deployment/provider-readback.json" \
          TAXKIT_WORKFLOW_CANDIDATE_COMMIT="$REVIEWED_WORKFLOW_SHA" \
          TAXKIT_WORKFLOW_STAGE="$stage" \
            bun run check:docs-deployment-workflow-teardown-proof

      - name: Prepare allowlisted Preview teardown evidence
        if: always()
        env:
          TAXKIT_WORKFLOW_ARTIFACT_MODE: preview-teardown
          TAXKIT_WORKFLOW_ARTIFACT_SOURCE: ${{ runner.temp }}/docs-deployment
          TAXKIT_WORKFLOW_ARTIFACT_UPLOAD: ${{ runner.temp }}/docs-preview-teardown-upload
        run: bun --conditions=source run tools/docs-deployment/workflow-artifact.runtime.ts

      - name: Upload sanitized Preview teardown evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxkit-docs-preview-teardown-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-preview-teardown-upload
          retention-days: 30
          if-no-files-found: error
