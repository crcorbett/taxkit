name: Pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# Deploy and destroy mutate the same pr-<number> stage, so they never overlap.
# Each run reads the pull request's current state before it mutates anything.
concurrency:
  group: taxkit-pr-${{ github.event.number }}
  cancel-in-progress: false

env:
  STAGE: pr-${{ github.event.number }}

jobs:
  deploy:
    name: Deploy preview
    # Fork pull requests never receive the preview credential.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
      url: ${{ steps.addresses.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch --track main origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - id: playwright-identity
        run: echo "version=$(apps/web/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}
      - run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}
      # Verification ends with the required credential-free native pair suite,
      # after source-rewriting tests and builds finish. A failure blocks plan/apply.
      # Same checks as the Checks workflow, before any credential is used. The
      # Turbo remote cache needs Checks' separate DOPPLER_CI_TOKEN, so deploys
      # use the local cache only.
      - name: Run verification and required native suite
        env:
          TURBO_CACHE: local:rw
        run: bun run verification
      - name: Check that the pull request is still open
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .state)"
          echo "open=$([ "$state" = open ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Plan preview with native Alchemy
        if: steps.pull-request.outputs.open == 'true'
        run: bun run pr:plan "$STAGE" --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy preview with native Alchemy
        if: steps.pull-request.outputs.open == 'true'
        shell: bash
        run: bun run pr:deploy "$STAGE" --yes 2>&1 | tee "$RUNNER_TEMP/deploy.log"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # The stage's workers.dev names carry generated suffixes, so read both
      # addresses from the stack outputs the deploy just printed.
      - name: Read stage addresses
        id: addresses
        if: steps.pull-request.outputs.open == 'true'
        shell: bash
        run: |
          log="$(sed -E $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log")"
          api="$(printf '%s\n' "$log" | sed -nE "s/.*apiUrl: '(https:[^']+)'.*/\1/p" | tail -n 1)"
          website="$(printf '%s\n' "$log" | sed -nE "s/.*websiteUrl: '(https:[^']+)'.*/\1/p" | tail -n 1)"
          for url in "$api" "$website"; do
            if [[ ! "$url" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev$ ]]; then
              echo "The deploy did not print a workers.dev stage address" >&2
              exit 1
            fi
          done
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
      - name: Check Website and public API
        if: steps.pull-request.outputs.open == 'true'
        shell: bash
        env:
          API_URL: ${{ steps.addresses.outputs.api }}
          WEBSITE_URL: ${{ steps.addresses.outputs.website }}
        run: |
          check() {
            code="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' "$1")"
            echo "$1 -> $code"
            test "$code" = 200
          }
          check "$WEBSITE_URL/"
          check "$API_URL/api/health"
          check "$API_URL/api/v1/calculators"

  cleanup:
    name: Destroy preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
    steps:
      # Destroy with the code that deployed this stage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Docs generation verifies immutable checked-source Git snapshots.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check that the pull request is closed
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .state)"
          echo "closed=$([ "$state" = closed ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Allowlist, not denylist: cleanup only ever destroys pr-<number> stages.
      # `pr:destroy` repeats this check before generation or credential loading.
      - name: Safety check
        if: steps.pull-request.outputs.closed == 'true'
        shell: bash
        run: |
          if [[ ! "$STAGE" =~ ^pr-[1-9][0-9]{0,6}$ ]]; then
            echo "Cleanup only destroys pr-<number> stages, got '$STAGE'" >&2
            exit 1
          fi
      - name: Destroy preview with native Alchemy
        if: steps.pull-request.outputs.closed == 'true'
        run: bun run pr:destroy "$STAGE" --yes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
