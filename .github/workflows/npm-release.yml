name: Release TaxKit SDK to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SDK version on main
        required: true
        type: string
      dry_run:
        description: Run the release checks and pack the SDK
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: taxkit-npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and pack the SDK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check the requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          jq -e --arg version "$EXPECTED_VERSION" '
            .name == "taxkit" and .version == $version and
            .private == false and .publishConfig.access == "public"
          ' packages/sdk/typescript/package.json >/dev/null
      - name: Install pinned dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run the release checks
        env:
          TURBO_CACHE: local:rw
        run: bun run release:check
      - name: Pack the checked SDK
        working-directory: packages/sdk/typescript
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          release_dir="$RUNNER_TEMP/taxkit-npm-release"
          mkdir -p "$release_dir"
          bun pm pack --destination "$release_dir" --quiet
          test -s "$release_dir/taxkit-$EXPECTED_VERSION.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taxkit-npm-archive
          path: ${{ runner.temp }}/taxkit-npm-release/taxkit-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    if: ${{ !inputs.dry_run }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global --ignore-scripts npm@12.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: taxkit-npm-archive
          path: ${{ runner.temp }}/taxkit-npm-release
      - name: Publish the checked archive through npm Trusted Publishing
        id: npm
        working-directory: ${{ runner.temp }}/taxkit-npm-release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          archive="./taxkit-$EXPECTED_VERSION.tgz"
          tar -xOzf "$archive" package/package.json | jq -e --arg version "$EXPECTED_VERSION" '
            .name == "taxkit" and .version == $version and
            .repository.url == "git+https://github.com/crcorbett/taxkit.git" and
            .publishConfig.access == "public"
          ' >/dev/null
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/taxkit/$EXPECTED_VERSION")
          if [[ "$status" != 404 ]]; then
            echo "::error::Expected npm to report this version as unpublished, got HTTP $status."
            exit 1
          fi
          integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          npm publish "$archive" --access public --registry=https://registry.npmjs.org --ignore-scripts
      - name: Verify the public version, archive and provenance
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.npm.outputs.integrity }}
        run: |
          for attempt in {1..40}; do
            if metadata=$(curl -fsS --connect-timeout 5 --max-time 10 \
              "https://registry.npmjs.org/taxkit/$EXPECTED_VERSION") &&
              tags=$(curl -fsS --connect-timeout 5 --max-time 10 \
              'https://registry.npmjs.org/-/package/taxkit/dist-tags') &&
              jq -e --arg version "$EXPECTED_VERSION" --arg integrity "$EXPECTED_INTEGRITY" '
                .name == "taxkit" and .version == $version and .dist.integrity == $integrity and
                .dist.attestations.provenance.predicateType == "https://slsa.dev/provenance/v1"
              ' <<<"$metadata" >/dev/null &&
              jq -e --arg version "$EXPECTED_VERSION" '.latest == $version' <<<"$tags" >/dev/null; then
              printf 'Verified taxkit@%s as latest with integrity %s and npm provenance.\n' \
                "$EXPECTED_VERSION" "$EXPECTED_INTEGRITY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm did not return the expected version, archive and provenance. Check the registry before retrying."
          exit 1
