name: Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job. A newer push cancels superseded verification, but a
# Preview or Production apply already in progress is never interrupted.

jobs:
  # Verification runs once per revision. Preview and Production deploy only
  # after this job succeeds, from the same checked commit.
  checks:
    if: github.event.action != 'closed'
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch --track main origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - id: playwright-identity
        run: echo "version=$(apps/web/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}
      - run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}
      - name: Fetch trusted CI configuration
        id: doppler-ci
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_CI_TOKEN }}
      - name: Check trusted CI configuration identity
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOPPLER_CONFIG: ${{ steps.doppler-ci.outputs.DOPPLER_CONFIG }}
          DOPPLER_PROJECT: ${{ steps.doppler-ci.outputs.DOPPLER_PROJECT }}
        run: test "$DOPPLER_PROJECT" = "taxkit" && test "$DOPPLER_CONFIG" = "ci"
      # Verification ends with the required credential-free native pair suite,
      # after source-rewriting tests and builds finish. A failure fails this
      # job, so no deploy job starts.
      - name: Run verification and required native suite with remote cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TURBO_CACHE: local:rw,remote:rw
          TURBO_TEAM: ${{ steps.doppler-ci.outputs.TURBO_TEAM }}
          TURBO_TOKEN: ${{ steps.doppler-ci.outputs.TURBO_TOKEN }}
        run: bun run verification
      - name: Run fork verification and required native suite without credentials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          TURBO_CACHE: local:rw
        run: bun run verification

  deploy:
    name: Deploy preview
    needs: checks
    # Fork pull requests never receive the preview credential.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Deploy and destroy mutate the same pr-<number> stage, so they never
    # overlap. Each run reads the pull request's current state before it
    # mutates anything.
    concurrency:
      group: taxkit-pr-${{ github.event.number }}
      cancel-in-progress: false
    env:
      STAGE: pr-${{ github.event.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
      url: ${{ steps.addresses.outputs.website }}
    steps:
      # Deploy the head commit the checks job verified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch --track main origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}
      # The deploy build compiles the docs catalogue, whose Mermaid diagrams
      # render through Playwright.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - id: playwright-identity
        run: echo "version=$(apps/web/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}
      - run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}
      - name: Check that the pull request is still open
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .state)"
          echo "open=$([ "$state" = open ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Deploy builds use the local Turbo cache only; the remote cache credential
      # stays with the checks job.
      - name: Plan preview with native Alchemy
        if: steps.pull-request.outputs.open == 'true'
        run: bun run pr:plan "$STAGE" --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy preview with native Alchemy
        if: steps.pull-request.outputs.open == 'true'
        shell: bash
        run: bun run pr:deploy "$STAGE" --yes 2>&1 | tee "$RUNNER_TEMP/deploy.log"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # The stage's workers.dev names carry generated suffixes, so read both
      # addresses from the stack outputs the deploy just printed.
      - name: Read stage addresses
        id: addresses
        if: steps.pull-request.outputs.open == 'true'
        shell: bash
        run: |
          log="$(sed -E $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log")"
          api="$(printf '%s\n' "$log" | sed -nE "s/.*apiUrl: '(https:[^']+)'.*/\1/p" | tail -n 1)"
          website="$(printf '%s\n' "$log" | sed -nE "s/.*websiteUrl: '(https:[^']+)'.*/\1/p" | tail -n 1)"
          for url in "$api" "$website"; do
            if [[ ! "$url" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev$ ]]; then
              echo "The deploy did not print a workers.dev stage address" >&2
              exit 1
            fi
          done
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
      - name: Check Website and public API
        if: steps.pull-request.outputs.open == 'true'
        shell: bash
        env:
          API_URL: ${{ steps.addresses.outputs.api }}
          WEBSITE_URL: ${{ steps.addresses.outputs.website }}
        run: |
          check() {
            code="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' "$1")"
            echo "$1 -> $code"
            test "$code" = 200
          }
          check "$WEBSITE_URL/"
          check "$API_URL/api/health"
          check "$API_URL/api/v1/calculators"

  cleanup:
    name: Destroy preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: taxkit-pr-${{ github.event.number }}
      cancel-in-progress: false
    env:
      STAGE: pr-${{ github.event.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
    steps:
      # Destroy with the code that deployed this stage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Docs generation verifies immutable checked-source Git snapshots.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check that the pull request is closed
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .state)"
          echo "closed=$([ "$state" = closed ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Allowlist, not denylist: cleanup only ever destroys pr-<number> stages.
      # `pr:destroy` repeats this check before generation or credential loading.
      - name: Safety check
        id: stage-safety
        if: steps.pull-request.outputs.closed == 'true'
        shell: bash
        run: |
          if [[ ! "$STAGE" =~ ^pr-[1-9][0-9]{0,6}$ ]]; then
            echo "Cleanup only destroys pr-<number> stages, got '$STAGE'" >&2
            exit 1
          fi
      # Catalogue compilation renders Mermaid diagrams through Playwright.
      # Cleanup has a fresh runner too; provision its browser before the build.
      - name: Prepare catalogue browser path
        id: catalogue-browser-path
        if: steps.pull-request.outputs.closed == 'true'
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Install catalogue Chromium
        id: catalogue-chromium
        if: steps.pull-request.outputs.closed == 'true'
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Destroy preview with native Alchemy
        if: steps.pull-request.outputs.closed == 'true'
        run: bun run pr:destroy "$STAGE" --yes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  production:
    name: Deploy production
    needs: checks
    # Only a push to main, or a manual run from main, deploys Production.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # One Production apply at a time; a queued run waits rather than cancelling
    # the apply in progress.
    concurrency:
      group: taxkit-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://taxkit.dev
    steps:
      # Deploy the commit the checks job verified.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch --track main origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - id: bun-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}
      # The deploy build compiles the docs catalogue, whose Mermaid diagrams
      # render through Playwright.
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - id: playwright-identity
        run: echo "version=$(apps/web/node_modules/.bin/playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-identity.outputs.version }}-${{ hashFiles('bun.lock') }}
      - run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}
      # Deploy builds use the local Turbo cache only; the remote cache credential
      # stays with the checks job.
      - name: Plan production with native Alchemy
        run: bun run production:plan --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy production with native Alchemy
        run: bun run production:deploy --yes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Check Website, www redirect and public API
        shell: bash
        run: |
          probe() {
            curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --output /dev/null --write-out "$2" "$1"
          }
          website="$(probe https://taxkit.dev/ '%{http_code}')"
          echo "https://taxkit.dev/ -> $website"
          test "$website" = 200
          redirect="$(probe 'https://www.taxkit.dev/docs?from=actions' '%{http_code} %{redirect_url}')"
          echo "https://www.taxkit.dev/docs?from=actions -> $redirect"
          test "$redirect" = "301 https://taxkit.dev/docs?from=actions"
          api="$(probe https://api.taxkit.dev/api/health '%{http_code}')"
          echo "https://api.taxkit.dev/api/health -> $api"
          test "$api" = 200
      # Information only: re-reads every deployed resource against the state the
      # deploy just wrote and reports drift without repairing it. Beta.81 can
      # report Workers with custom domains as changed after a clean deploy.
      - name: Read back provider drift with native Alchemy
        continue-on-error: true
        run: bun run production:drift --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
